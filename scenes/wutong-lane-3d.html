<title>Wutong Lane 3D</title>
<style>
/* Full-bleed WebGL scene, one floating day/night toggle. Single deliberate look: sky colours are driven from script. */
:root{--sky:#cfe0ea;--btn:rgba(255,255,255,.85);--btn-fg:#2c3a44;color-scheme:light}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#mode{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;border:0;background:var(--btn);color:var(--btn-fg);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.22);transition:background .4s,color .4s}
#mode:focus-visible{outline:2px solid #f2b84b;outline-offset:3px}
#mode svg{width:22px;height:22px}
[hidden]{display:none!important}
body.night{--btn:rgba(28,38,56,.85);--btn-fg:#f2d48a}
</style>

<canvas id="c" aria-label="3D model of Wutong Lane Commercial Street" role="img"></canvas>
<button id="mode" type="button" aria-label="Switch to night" aria-pressed="false">
  <svg id="ico-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg>
  <svg id="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4.2" fill="currentColor"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
// Spec coordinates: x east, y north (metres). three.js: X = x, Y = up, Z = -y.
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const DAY_SKY = new THREE.Color('#cfe0ea'), NIGHT_SKY = new THREE.Color('#0d1626');
scene.background = DAY_SKY.clone();
scene.fog = new THREE.Fog(DAY_SKY.clone(), 160, 560);

const camera = new THREE.PerspectiveCamera(42, 1, 0.3, 1500);
camera.position.set(34, 46, 58);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.set(100, 0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI * 0.47;
controls.minDistance = 8;
controls.maxDistance = 320;
controls.autoRotate = !matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.autoRotateSpeed = 0.35;
controls.addEventListener('start', () => { controls.autoRotate = false; });

// ---------- lights ----------
const hemi = new THREE.HemisphereLight('#eaf3ff', '#8a8370', 0.75);
scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff3dd', 1.9);
sun.position.set(165, 110, 70);
sun.target.position.set(100, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -150, right: 150, top: 90, bottom: -90, near: 10, far: 400 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// ---------- helpers ----------
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
// r128 treats hex colours as linear; convert so material colours match their sRGB swatches
const M = (color, o = {}) => { const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.85, metalness: 0 }, o)); m.color.convertSRGBToLinear(); return m; };
const nightMats = []; // {mat, max}
function glow(mat, emissive, max) { mat.emissive = new THREE.Color(emissive).convertSRGBToLinear(); mat.emissiveIntensity = 0; nightMats.push({ mat, max }); return mat; }

function put(mesh, cast = true, recv = true, parent = scene) {
  mesh.castShadow = cast; mesh.receiveShadow = recv; parent.add(mesh); return mesh;
}
// box: wx along x, wy along spec-y, h up; centred at (cx, cy), sitting on `base`
function B(wx, wy, h, mat, cx, cy, base = 0, cast = true, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(wx, h, wy), mat);
  m.position.set(cx, base + h / 2, -cy);
  return put(m, cast, true, parent);
}
function C(r, h, mat, cx, cy, base = 0, seg = 14, r2 = r, cast = true) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r2, r, h, seg), mat);
  m.position.set(cx, base + h / 2, -cy);
  return put(m, cast);
}
function P(wx, wy, mat, cx, cy, h = 0.01) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(wx, wy), mat);
  m.rotation.x = -Math.PI / 2; m.position.set(cx, h, -cy);
  return put(m, false, true);
}
function canvasTex(w, h, draw, rx = 1, ry = 1, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}
function tileTex(base, line, n, jitter, rx, ry) {
  return canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = base; g.fillRect(0, 0, w, h);
    const s = w / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      g.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},${Math.random() * jitter})`;
      g.fillRect(i * s, j * s, s, s);
    }
    g.strokeStyle = line; g.lineWidth = 2;
    for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
  }, rx, ry);
}

// ---------- ground & paving ----------
P(1400, 1400, M('#8d9783'), 100, 0, -0.02).receiveShadow = true;
const asphalt = M('#6d6f70', { roughness: 0.95 });
P(280, 8, asphalt, 100, 22, 0.0);   // service alleys behind the shops
P(280, 8, asphalt, 100, -22, 0.0);
P(30, 60, asphalt, 225, 0, 0.0);    // road beyond the east entrance

// Central walkway (y -3..3) and entrance plazas
P(200, 6, M('#ffffff', { map: tileTex('#d3cbbd', '#b3aa9a', 6, .07, 200 / 3, 2) }), 100, 0, 0.02);
P(14, 24, M('#ffffff', { map: tileTex('#c9bfae', '#a99f8e', 6, .06, 14 / 3, 8) }), -7, 0, 0.02);
P(10, 16, M('#ffffff', { map: tileTex('#c9bfae', '#a99f8e', 6, .06, 10 / 3, 16 / 3) }), 205, 0, 0.02);
// Covered arcade floors (3 m each side)
for (const [x0, x1] of [[0, 80], [120, 200]]) for (const s of [1, -1]) {
  P(x1 - x0, 3, M('#ffffff', { map: tileTex('#b9a58c', '#9c8870', 4, .08, (x1 - x0) / 2, 1.5) }), (x0 + x1) / 2, s * 4.5, 0.025);
  B(x1 - x0, 0.25, 0.06, M('#8f8476'), (x0 + x1) / 2, s * 3, 0); // kerb line between arcade and walkway
}
// Central plaza (x 80..120) with ring paving around the fountain
P(40, 36, M('#ffffff', {
  map: canvasTex(1024, 922, (g, w, h) => {
    const k = w / 40, cx = w / 2, cy = h / 2;
    g.fillStyle = '#d6cab4'; g.fillRect(0, 0, w, h);
    for (let r = 20; r >= 5; r -= 1.5) {
      g.beginPath(); g.arc(cx, cy, r * k, 0, Math.PI * 2);
      g.fillStyle = ((r - 5) / 1.5) % 2 < 1 ? '#d6cab4' : '#c8b99f'; g.fill();
    }
    g.strokeStyle = 'rgba(120,100,80,.35)'; g.lineWidth = 2;
    for (let a = 0; a < 32; a++) {
      const t = a / 32 * Math.PI * 2;
      g.beginPath(); g.moveTo(cx + Math.cos(t) * 5 * k, cy + Math.sin(t) * 5 * k); g.lineTo(cx + Math.cos(t) * 30 * k, cy + Math.sin(t) * 30 * k); g.stroke();
    }
    g.lineWidth = 10; g.strokeStyle = '#a89878'; g.strokeRect(5, 5, w - 10, h - 10);
  }, 1, 1)
}), 100, 0, 0.03);

// ---------- shops ----------
// side, x0, x1, floors, wall, accent, kind, status, night window tint
const SHOPS = [
  ['N', 0, 25, 1, '#e3d3bd', '#b4432f', 'noodles', 'open', '#ffcf8a'],
  ['N', 25, 50, 2, '#7a5a44', '#3d2a1f', 'coffee', 'open', '#ffc477'],
  ['N', 50, 80, 1, '#efe3cf', '#d2913f', 'bakery', 'open', '#ffd99a'],
  ['N', 120, 150, 2, '#4d6478', '#22384a', 'books', 'open', '#ffd38a'],
  ['N', 150, 175, 1, '#ece8e0', '#8c8172', 'apparel', 'open', '#fff0d8'],
  ['N', 175, 200, 1, '#c5d6bd', '#6f9a63', 'flowers', 'reno', null],
  ['S', 0, 20, 1, '#d8efe9', '#2f9686', 'tea', 'open', '#d8fff4'],
  ['S', 20, 55, 2, '#8e3328', '#e0b04a', 'hotpot', 'open', '#ffb36b'],
  ['S', 55, 80, 1, '#f0f2ee', '#2e7d4f', 'mart', 'open', '#eef8ff'],
  ['S', 120, 145, 1, '#e8d6bf', '#b37a3e', 'home', 'open', '#ffe0b0'],
  ['S', 145, 170, 1, '#dfe4ec', '#4f6d9a', 'optical', 'open', '#f2f7ff'],
  ['S', 170, 200, 1, '#a9a49d', '#77726b', 'stationery', 'vacant', null],
];
const FLOOR = 4.7;
const metal = M('#4a4f55', { roughness: 0.5, metalness: 0.6 });
const darkWood = M('#5a4232');
const roofMat = M('#7c7f80', { roughness: 0.95 });
const acMat = M('#d9dbdc', { roughness: 0.6 });
const chairMats = [M('#3b3f44'), M('#b98a5a'), M('#2f6f62')];
const leafMats = [M('#5f8f45'), M('#6f9c4c'), M('#527f3d')];

function shop([side, sx0, sx1, floors, wall, accent, kind, status, lit]) {
  const n = side === 'N' ? 1 : -1;          // +1 north, -1 south (spec y)
  const x0 = sx0 + 0.12, x1 = sx1 - 0.12, w = x1 - x0, cx = (x0 + x1) / 2;
  const H = floors === 2 ? 9.4 : 5.8;
  const front = 6 * n;                      // shopfront line
  const out = -n;                           // direction toward the street
  const wallMat = M(wall);
  B(w, 12, H, wallMat, cx, 12 * n);
  B(w + 0.3, 12.3, 0.35, roofMat, cx, 12 * n, H);                         // parapet cap
  B(w, 0.6, 0.25, M('#3a3632'), cx, front + out * 0.3, 0);               // plinth
  // sign band: plain colour, glows at night
  const sign = B(w - 0.6, 0.35, 0.95, glow(M(accent, { roughness: 0.5 }), accent, status === 'open' ? 0.9 : 0), cx, front + out * 0.18, 4.55);
  // ground floor front
  if (status === 'open') {
    const glass = glow(M('#9fb7c0', { roughness: 0.08, metalness: 0.3, transparent: true, opacity: 0.85 }), lit, 1.6);
    B(w - 1.2, 0.18, 3.3, glass, cx, front + out * 0.1, 0.5, false);
    for (let x = x0 + 0.6; x <= x1 - 0.5; x += (w - 1.2) / Math.max(2, Math.round(w / 4))) B(0.14, 0.24, 3.4, metal, x, front + out * 0.12, 0.45);
    B(w - 1.0, 0.26, 0.14, metal, cx, front + out * 0.12, 3.8);
    B(1.8, 0.2, 2.7, M('#2a2c2e', { roughness: 0.3 }), cx, front + out * 0.16, 0.5, false); // door
  } else if (status === 'vacant') {
    const shutter = M('#ffffff', {
      map: canvasTex(64, 256, (g, ww, hh) => { g.fillStyle = '#a7aaad'; g.fillRect(0, 0, ww, hh); for (let y = 0; y < hh; y += 8) { g.fillStyle = '#8b8e91'; g.fillRect(0, y, ww, 2); g.fillStyle = '#c3c5c7'; g.fillRect(0, y + 2, ww, 1); } }, w / 4, 1), metalness: 0.4, roughness: 0.5
    });
    B(w - 1.0, 0.2, 3.8, shutter, cx, front + out * 0.1, 0.3);
    B(w - 0.6, 0.5, 0.5, M('#6b6e72'), cx, front + out * 0.25, 4.1); // shutter box
  } else { // renovation: hoarding, scaffold, netting
    B(w - 0.6, 0.15, 3.0, M('#d9d1bf'), cx, front + out * 2.7, 0);
    for (let x = x0 + 0.4; x <= x1; x += 2.5) {
      B(0.1, 0.1, H + 1.2, M('#9aa0a6', { metalness: 0.6, roughness: 0.4 }), x, front + out * 0.9, 0);
      B(0.1, 0.1, H + 1.2, M('#9aa0a6', { metalness: 0.6, roughness: 0.4 }), x, front + out * 1.9, 0);
    }
    for (let h = 2; h < H + 1; h += 2) B(w, 0.08, 0.08, metal, cx, front + out * 1.4, h);
    const net = new THREE.Mesh(new THREE.PlaneGeometry(w, H - 3.6), M('#3f7d4a', { transparent: true, opacity: 0.55, side: THREE.DoubleSide }));
    net.position.set(cx, 4.6 + (H - 3.6) / 2, -(front + out * 2.0)); put(net, false, false);
  }
  // upper floor windows
  if (floors === 2) {
    const wmat = glow(M('#7f97a3', { roughness: 0.15, metalness: 0.3 }), lit || '#000', 1.0);
    const bays = Math.round(w / 4.2);
    for (let i = 0; i < bays; i++) {
      const x = x0 + (i + 0.5) * (w / bays);
      B(2.6, 0.14, 2.4, wmat, x, front + out * 0.07, 6.0, false);
      B(2.9, 0.4, 0.15, M(accent), x, front + out * 0.2, 5.85);
    }
    if (kind === 'coffee') { // small terrace balcony
      B(w - 3, 1.4, 0.2, darkWood, cx, front + out * 0.7, 5.4);
      B(w - 3, 0.06, 0.9, metal, cx, front + out * 1.38, 5.6);
    }
  }
  // rooftop plant
  for (let i = 0; i < 2 + (w > 28 ? 1 : 0); i++) B(rnd(1.2, 2), rnd(1, 1.6), rnd(0.8, 1.2), acMat, rnd(x0 + 2, x1 - 2), rnd(9, 16) * n, H + 0.35);
  if (floors === 2) C(0.8, 1.6, M('#b9bfc4', { metalness: 0.5, roughness: 0.4 }), rnd(x0 + 3, x1 - 3), 15 * n, H + 0.35);

  // arcade furniture (stays within 3 m of the shopfront: y 3..6)
  const dining = ['noodles', 'coffee', 'bakery', 'tea', 'hotpot'].includes(kind);
  if (dining) {
    const top = M(kind === 'hotpot' ? '#6d1f1a' : '#e9e4dc', { roughness: 0.6 });
    for (let x = x0 + 2.6; x < x1 - 2; x += 4.4) {
      if (Math.abs(x - cx) < 1.6) continue; // keep the door clear
      const y = 4.55 * n;
      C(0.45, 0.06, top, x, y, 0.72, 16);
      C(0.05, 0.72, metal, x, y, 0, 6);
      const cm = pick(chairMats);
      for (const d of [-0.8, 0.8]) { B(0.42, 0.42, 0.45, cm, x + d, y, 0); B(0.06, 0.42, 0.45, cm, x + d + (d > 0 ? 0.21 : -0.21), y, 0.45); }
    }
  } else if (status === 'open') {
    const planter = M('#6d6a64');
    for (const x of [x0 + 1.2, x1 - 1.2]) {
      B(0.9, 0.9, 0.6, planter, x, 5.3 * n, 0);
      const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(0.6, 1), pick(leafMats));
      bush.position.set(x, 1.05, -5.3 * n); put(bush);
    }
    if (kind === 'apparel') { // clothing rack
      B(3, 0.05, 0.05, metal, cx + 4, 5.2 * n, 1.6);
      for (const x of [cx + 2.5, cx + 5.5]) B(0.05, 0.05, 1.6, metal, x, 5.2 * n, 0);
      for (let i = 0; i < 9; i++) B(0.28, 0.5, 0.9, M(pick(['#c7b9a5', '#5b6d7c', '#efe9df', '#8f5f4a', '#2f3a40'])), cx + 2.7 + i * 0.32, 5.2 * n, 0.7);
    }
    if (kind === 'books') { B(1.8, 0.8, 0.9, darkWood, cx - 5, 5.1 * n, 0); for (let i = 0; i < 10; i++) B(0.14, 0.6, rnd(0.22, 0.32), M(pick(['#b23a2e', '#2d5a7b', '#e3c26b', '#3b6b4a', '#efe6d4'])), cx - 5.8 + i * 0.17, 5.1 * n, 0.9); }
    if (kind === 'mart') { B(1.8, 0.8, 0.9, glow(M('#e8f1f6'), '#bfe3ff', 0.5), cx + 4, 5.2 * n, 0); }
    if (kind === 'home') { for (let i = 0; i < 4; i++) C(0.32, 0.45, M(pick(['#c9a46c', '#a77b4c', '#e3d2b5'])), cx + 3 + i * 0.8, 5.3 * n, 0, 10); }
  }
}
SHOPS.forEach(shop);

// ---------- covered arcade: columns, glass canopy, lanterns ----------
const canopy = M('#a8c6cf', { roughness: 0.1, metalness: 0.2, transparent: true, opacity: 0.42, depthWrite: false });
const lanternMat = glow(M('#c2332b', { roughness: 0.5 }), '#ff5a3a', 2.2);
const gold = M('#c9a24a', { roughness: 0.4, metalness: 0.7 });
for (const [x0, x1] of [[0, 80], [120, 200]]) for (const n of [1, -1]) {
  const len = x1 - x0, mid = (x0 + x1) / 2;
  B(len, 3, 0.12, canopy, mid, 4.5 * n, 4.2, false);
  B(len, 0.2, 0.32, metal, mid, 3.1 * n, 4.0);
  for (let x = x0 + 0.3; x <= x1; x += 5) { C(0.13, 4.2, metal, x, 3.15 * n, 0, 10); B(0.08, 3, 0.08, metal, x, 4.5 * n, 4.2); }
  for (let x = x0 + 5; x < x1; x += 10) {
    const l = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), lanternMat);
    l.scale.set(1, 1.15, 1); l.position.set(x - 2.5, 3.35, -3.45 * n); put(l, true, false);
    C(0.16, 0.08, gold, x - 2.5, 3.45 * n, 3.65, 10); C(0.16, 0.08, gold, x - 2.5, 3.45 * n, 2.95, 10);
    C(0.012, 0.3, gold, x - 2.5, 3.45 * n, 3.73, 4);
  }
}

// ---------- central plaza ----------
// F-01 fountain at (100, 0)
const stone = M('#c9c2b4', { roughness: 0.7 });
const water = M('#4f9fbf', { roughness: 0.06, metalness: 0.25, transparent: true, opacity: 0.9 });
C(4.4, 0.65, stone, 100, 0, 0, 40);
C(4.0, 0.05, water, 100, 0, 0.55, 40, 4.0, false);
C(0.5, 1.7, stone, 100, 0, 0.55, 18, 0.35);
C(0.25, 0.35, stone, 100, 0, 2.15, 24, 1.4);
C(1.3, 0.04, water, 100, 0, 2.45, 24, 1.3, false);
const NW = 2200, wPos = new Float32Array(NW * 3), wVel = new Float32Array(NW * 3), wType = new Uint8Array(NW);
function spawn(i, warm) {
  const t = i % 3 === 0 ? 0 : 1; wType[i] = t;
  if (t === 0) { // central crown jet
    const a = rnd(0, Math.PI * 2), s = rnd(0.25, 0.7);
    wPos.set([100, 2.5, 0], i * 3); wVel.set([Math.cos(a) * s, rnd(5.2, 6.2), Math.sin(a) * s], i * 3);
  } else { // ring of 16 arching jets aimed inward
    const a = ((Math.random() * 16) | 0) / 16 * Math.PI * 2 + rnd(-0.02, 0.02);
    wPos.set([100 + Math.cos(a) * 3.7, 0.65, Math.sin(a) * 3.7], i * 3);
    const s = rnd(1.3, 1.5);
    wVel.set([-Math.cos(a) * s, rnd(3.6, 4.0), -Math.sin(a) * s], i * 3);
  }
  if (warm) { const k = Math.random() * 0.9; for (let j = 0; j < 3; j++) wPos[i * 3 + j] += wVel[i * 3 + j] * k; wVel[i * 3 + 1] -= 9.8 * k; }
}
for (let i = 0; i < NW; i++) spawn(i, true);
const wGeo = new THREE.BufferGeometry();
wGeo.setAttribute('position', new THREE.BufferAttribute(wPos, 3));
const wMat = new THREE.PointsMaterial({ color: '#e6f6ff', size: 0.13, transparent: true, opacity: 0.85, depthWrite: false });
const spray = new THREE.Points(wGeo, wMat); spray.frustumCulled = false; scene.add(spray);

// F-02 public restrooms at (100, -10), entrance facing the plaza
B(7, 5, 3.3, M('#d8d2c6'), 100, -12.6);
B(7.6, 5.6, 0.3, roofMat, 100, -12.6, 3.3);
for (const x of [98.2, 101.8]) B(1.1, 0.12, 2.3, M('#3d4f5c'), x, -10.06, 0);
B(0.5, 0.12, 0.5, M('#3f7fb5'), 98.2, -10.08, 2.55); B(0.5, 0.12, 0.5, M('#c4534a'), 101.8, -10.08, 2.55);

// F-04 benches: 12 sets along the plaza's north and south edges, facing the fountain
const benchWood = M('#a0724a', { roughness: 0.7 });
const BENCH_X = [85, 90, 95, 105, 110, 115];
for (const n of [1, -1]) for (const x of BENCH_X) {
  const y = 6.6 * n;
  B(1.8, 0.5, 0.08, benchWood, x, y, 0.45);
  B(1.8, 0.08, 0.45, benchWood, x, y + 0.27 * n, 0.55);
  for (const d of [-0.75, 0.75]) B(0.08, 0.5, 0.45, metal, x + d, y, 0);
}

function walkerY(p) { // detour around the fountain basin

  if (Math.abs(dx) < R) { const need = Math.sqrt(R * R - dx * dx); if (Math.abs(p.lane) < need) return Math.sign(p.lane) * need; }

}

// ---------- day / night ----------

  document.getElementById('ico-moon').hidden = !!nightTarget;
  document.getElementById('ico-sun').hidden = !nightTarget;
  document.body.classList.toggle('night', !!nightTarget);
});
const SUN_DAY = new THREE.Color('#fff3dd'), SUN_NIGHT = new THREE.Color('#8fa6d6');
function applyNight(t) {
  scene.background.copy(DAY_SKY).lerp(NIGHT_SKY, t);
  scene.fog.color.copy(scene.background);
  document.body.style.background = '#' + scene.background.getHexString();
  hemi.intensity = 0.75 - 0.6 * t;
  hemi.color.set('#eaf3ff').lerp(new THREE.Color('#5d6f9a'), t);
  sun.intensity = 1.9 - 1.72 * t;
  sun.color.copy(SUN_DAY).lerp(SUN_NIGHT, t);
  for (const { mat, max } of nightMats) mat.emissiveIntensity = max * t;
  wMat.color.set('#e6f6ff').lerp(new THREE.Color('#9fdcff'), t);
}

// ---------- loop ----------
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();

const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (Math.abs(night - nightTarget) > 0.001) { night += (nightTarget - night) * Math.min(1, dt * 2.5); applyNight(night); }

  if (!reduce) {
    for (let i = 0; i < NW; i++) {
      const k = i * 3;
      wVel[k + 1] -= 9.8 * dt;
      wPos[k] += wVel[k] * dt; wPos[k + 1] += wVel[k + 1] * dt; wPos[k + 2] += wVel[k + 2] * dt;
      if (wVel[k + 1] < 0) {
        const r = Math.hypot(wPos[k] - 100, wPos[k + 2]);
        if (wPos[k + 1] < 0.6 || (r < 1.35 && wPos[k + 1] < 2.45)) spawn(i, false);
      }
    }
    wGeo.attributes.position.needsUpdate = true;

    for (const p of walkers) {
      p.x += p.dir * p.speed * dt;
      if (p.x > 209) p.dir = -1; else if (p.x < -10) p.dir = 1;
      const ty = walkerY(p), oy = p.py;
      p.py += (ty - p.py) * Math.min(1, dt * 3);
      p.g.position.set(p.x, Math.abs(Math.sin(t * p.speed * 5 + p.phase)) * 0.04, -p.py);
      p.g.rotation.y = Math.atan2(p.dir * p.speed * dt, -(p.py - oy));
      const sw = Math.sin(t * p.speed * 5 + p.phase) * 0.5;
      p.legs[0].rotation.x = sw; p.legs[1].rotation.x = -sw;
    }
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
